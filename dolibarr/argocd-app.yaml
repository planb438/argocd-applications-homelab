apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dolibarr
  namespace: argocd
  labels:
    app: dolibarr
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_REPO/dolibarr-argocd.git
    targetRevision: HEAD
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: dolibarr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
