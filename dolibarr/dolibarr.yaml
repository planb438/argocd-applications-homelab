apiVersion: apps/v1
kind: Deployment
metadata:
  name: dolibarr
  namespace: dolibarr
  labels:
    app: dolibarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dolibarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: dolibarr
    spec:
      containers:
        - name: dolibarr
          image: tuxgasy/dolibarr:latest
          ports:
            - containerPort: 80
          env:
            - name: DOLI_DB_HOST
              value: "mysql"
            - name: DOLI_DB_NAME
              value: "dolibarr"
            - name: DOLI_DB_USER
              value: "dolibarr"
            - name: DOLI_DB_PASSWORD
              value: "dolipass"
          volumeMounts:
            - name: dolibarr-data
              mountPath: /var/www/documents
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5
      volumes:
        - name: dolibarr-data
          persistentVolumeClaim:
            claimName: dolibarr-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dolibarr-pvc
  namespace: dolibarr
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
