apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dolibarr

resources:
  - namespace.yaml
  - secret.yaml
  - mysql.yaml
  - dolibarr.yaml
  - service.yaml

images:
  - name: mariadb
    newTag: "10.11"
  - name: tuxgasy/dolibarr
    newTag: "latest"

# Optional: Add common labels
commonLabels:
  managed-by: argocd
  environment: dev

# Optional: Add annotations
commonAnnotations:
  argocd.argoproj.io/sync-options: PruneLast=true
